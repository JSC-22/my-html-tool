<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국 TV</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1b1f26;
    --line: #2a303a;
    --text: #e8eaee;
    --muted: #8b94a4;
    --accent: #f2b134;
    --danger: #ff7b72;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  #app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }

  aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  #top { padding: 12px; border-bottom: 1px solid var(--line); }
  #q {
    width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit;
  }
  #q:focus-visible, button:focus-visible, .ch:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #tabs button {
    padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
  }
  #tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1a1405; font-weight: 600; }

  #list { flex: 1; overflow-y: auto; padding: 6px; }
  .ch {
    display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center;
    width: 100%; padding: 7px 8px; border-radius: 8px; border: 0; background: transparent;
    color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .ch:hover { background: #232933; }
  .ch[aria-current="true"] { background: #2a2f1f; box-shadow: inset 3px 0 0 var(--accent); }
  .logo { width: 44px; height: 30px; display: grid; place-items: center; background: #fff1; border-radius: 5px; overflow: hidden; }
  .logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .ch .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch .np { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  #qrow { display: flex; gap: 8px; }
  #qrow #q { flex: 1; min-width: 0; }
  #pv {
    flex: none; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
  }
  #pv[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1a1405; font-weight: 600; }
  .logo { position: relative; }
  .logo img.thumb { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; }
  body.pv .ch { grid-template-columns: 96px 1fr; }
  body.pv .logo { width: 96px; height: 54px; }
  .sphead { padding: 8px 8px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .sphead .sub { margin-top: 4px; color: var(--muted); font-size: 12px; }
  .sphead .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sphead button {
    padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: #2a303a; color: var(--text); font: inherit; font-size: 12px; cursor: pointer;
  }
  .sphead button:disabled { opacity: .5; cursor: default; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow-y: auto; }
  #stage { position: relative; background: #000; }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: 78vh; background: #000; }
  #msg {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 20px; text-align: center; background: #000c; font-size: 14px;
  }
  #msg.show { display: flex; }
  #msg.error .t { color: var(--danger); }
  #msg a, #msg button {
    color: var(--text); background: #2a303a; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font: inherit; font-size: 13px; text-decoration: none; cursor: pointer;
  }
  #msg .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  #info { padding: 16px 20px 28px; max-width: 900px; }
  #cname { font-size: 20px; font-weight: 700; }
  #reload {
    margin-top: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: #2a303a; color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
  }
  #now { margin-top: 6px; font-size: 16px; }
  #nowtime, #next { color: var(--muted); font-size: 13px; }
  #bar { height: 4px; margin: 10px 0 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  #sched { margin-top: 14px; border-top: 1px solid var(--line); }
  .pg { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .pg time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pg.on { color: var(--accent); }
  .pg.on time { color: var(--accent); }

  #nav { display: none; }

  /* 모바일: 채널 선택 화면 → 채널을 누르면 재생 화면(뒤로가기로 복귀) */
  @media (max-width: 820px) {
    * { -webkit-tap-highlight-color: transparent; }
    #app { display: block; height: 100%; height: 100dvh; }
    aside, main { height: 100%; }
    aside { border-right: 0; }
    main { overflow-y: auto; }
    #app:not(.playing) main { display: none; }
    #app.playing aside { display: none; }

    #top { padding: 10px 12px 8px; }
    #q { padding: 11px 14px; font-size: 16px; } /* 16px 미만이면 iOS가 입력 시 확대함 */
    #tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    #tabs::-webkit-scrollbar { display: none; }
    #tabs button { flex: none; padding: 7px 14px; font-size: 14px; }

    #list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start; padding: 10px; }
    .ch {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 12px 8px; background: #232933; text-align: center; border-radius: 12px;
    }
    .ch[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--accent); background: #2a2f1f; }
    .logo { width: 100%; height: 46px; }
    body.pv .logo { width: 100%; height: auto; aspect-ratio: 16 / 9; }
    #pv { padding: 0 14px; font-size: 14px; }
    .ch > div:last-child { width: 100%; min-width: 0; }
    .ch .nm { display: block; font-weight: 600; }
    .ch .np { margin-top: 2px; }
    .sphead { grid-column: 1 / -1; }
    .sphead button { padding: 8px 12px; font-size: 13px; }

    #nav {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
    }
    #nav button {
      flex: none; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: #2a303a; color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
    }
    #navt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    video { max-height: 56vh; }
    #info { padding: 12px 14px 32px; }
  }
  @media (prefers-reduced-motion: no-preference) { #bar i { transition: width .6s linear; } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div id="top">
      <div id="qrow">
        <input id="q" type="search" placeholder="채널 검색" autocomplete="off">
        <button id="pv" type="button" aria-pressed="false" title="보이는 채널의 영상을 잠깐 받아 미리보기 화면을 만듭니다">미리보기</button>
      </div>
      <div id="tabs" role="group" aria-label="채널 그룹"></div>
    </div>
    <div id="list" role="list"></div>
    <div id="status">목록을 불러오는 중…</div>
  </aside>
  <main>
    <div id="nav">
      <button id="back" type="button">‹ 목록</button>
      <span id="navt"></span>
      <button id="navprev" type="button" aria-label="이전 채널">▲</button>
      <button id="navnext" type="button" aria-label="다음 채널">▼</button>
    </div>
    <div id="stage">
      <video id="v" controls autoplay playsinline></video>
      <div id="msg"></div>
    </div>
    <div id="info">
      <div id="cname">채널을 선택하세요</div>
      <div id="now"></div>
      <div id="nowtime"></div>
      <div id="bar"><i></i></div>
      <div id="next"></div>
      <button id="reload" type="button">↻ 주소 새로고침</button>
      <div id="sched"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
(() => {
  // 데이터 주소: 1순위는 저장소(kenpark76/kenpark76.github.io)의 raw 주소(커밋 즉시 반영),
  // 응답이 없거나 오류면 같은 저장소의 GitHub Pages 사이트로 자동 대체한다.
  const SOURCES = [
    'https://raw.githubusercontent.com/kenpark76/kenpark76.github.io/main/',
    'https://kenpark76.github.io/'
  ];
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  let srcName = '';
  async function fetchData(file) {
    let lastErr = new Error(file + ' 주소 없음');
    for (const base of SOURCES) {
      try {
        const r = await fetch(base + file + '?t=' + Date.now(), { cache: 'no-store' });
        if (r.ok) { srcName = base.includes('raw.githubusercontent') ? 'raw' : 'pages'; return r; }
        lastErr = new Error(file + ' ' + r.status);
      } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }
  const $ = s => document.querySelector(s);
  const norm = s => (s || '').replace(/[\s\-_]+/g, '').toLowerCase();
  const key = c => c.group + '|' + c.name;
  const fmt = ms => new Date(ms).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' });

  const mobile = () => matchMedia('(max-width: 820px)').matches;
  let savedScroll = 0;
  let preview = false;
  try { preview = localStorage.getItem('koreatv:preview') === '1'; } catch (e) {}
  const thumbs = {}, capQueue = [], queued = new Set();
  let capBusy = 0, io = null;
  let channels = [], visible = [];

  // SPOTV NOW 이벤트 채널 (ch01~ch80). 방송 중인 것만 목록에 표시한다.
  // 주소가 바뀌면 아래 둘 중 하나만 고치면 된다.
  const SPOTV_ID = '15081508901533355307';  // 주소 중간의 medialist_숫자_hls.m3u8 의 숫자
  const SPOTV_LIST_URL = '';                // 주소 목록(txt/m3u) 파일의 URL을 넣으면 확인할 때마다 거기서 읽어온다 (CORS 허용 필요)
  const SPOTV = Array.from({ length: 80 }, (_, i) => {
    const n = String(i + 1).padStart(2, '0');
    const name = 'SPOTV NOW ' + n;
    return {
      group: 'SPOTV NOW', name, title: name, logo: '', extra: true,
      uris: [`https://ch${n}-nlivecdn.spotvnow.co.kr/ch${n}/decr/medialist_${SPOTV_ID}_hls.m3u8`]
    };
  });
  let live = {}, seen = {}, probing = false, probeDone = 0, lastProbe = 0, showUnknown = false;
  let epgIds = {}, progs = {};
  let tab = 'KR', query = '', currentKey = null, hls = null, lastLoad = 0, attempt = 0, uriIdx = 0, playingUrl = '';

  // ---------- 데이터 ----------
  async function loadChannels() {
    const r = await fetchData('koreatv.json');
    channels = await r.json();
    lastLoad = Date.now();
  }

  function parseTime(s) {
    const m = /^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)\s*([+-])(\d\d)(\d\d)/.exec(s || '');
    if (!m) return 0;
    const off = (+m[8] * 60 + +m[9]) * 60000 * (m[7] === '-' ? -1 : 1);
    return Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) - off;
  }

  async function loadEpg() {
    try {
      const r = await fetchData('koreatvEPG.xml');
      const doc = new DOMParser().parseFromString(await r.text(), 'application/xml');
      const ids = {}, pr = {};
      doc.querySelectorAll('channel').forEach(c => {
        const id = c.getAttribute('id');
        c.querySelectorAll('display-name').forEach(d => {
          const k = norm(d.textContent);
          if (!(k in ids)) ids[k] = id;
        });
      });
      doc.querySelectorAll('programme').forEach(p => {
        const id = p.getAttribute('channel');
        (pr[id] = pr[id] || []).push({
          s: parseTime(p.getAttribute('start')),
          e: parseTime(p.getAttribute('stop')),
          t: (p.querySelector('title') || {}).textContent || ''
        });
      });
      epgIds = ids; progs = pr;
    } catch (e) { console.warn('EPG 로드 실패', e); }
  }

  const programmes = ch => progs[epgIds[norm(ch.name)] || epgIds[norm(ch.title)]] || [];
  const nowOf = ch => { const t = Date.now(); return programmes(ch).find(p => p.s <= t && t < p.e); };

  // ---------- 목록 ----------
  function groups() {
    const set = [];
    channels.forEach(c => { if (c.group && !set.includes(c.group)) set.push(c.group); });
    return set;
  }

  function renderTabs() {
    const box = $('#tabs');
    box.textContent = '';
    const items = [['KR', '한국 전체'], ['ALL', '전체'], ['SPOTV', 'SPOTV NOW'], ...groups().map(g => [g, g])];
    items.forEach(([v, label]) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.setAttribute('aria-pressed', String(tab === v));
      b.onclick = () => { tab = v; renderTabs(); renderList(); if (v === 'SPOTV') maybeProbe(); };
      box.appendChild(b);
    });
  }

  function renderList() {
    const q = norm(query);
    visible = allChannels().filter(c => {
      if (!(c.uris && c.uris.length)) return false;
      if (c.extra) {
        if (tab !== 'ALL' && tab !== 'SPOTV') return false;
        const st = live[key(c)];
        if (!(st === 'live' || (showUnknown && st === 'unknown'))) return false;
      } else {
        if (tab === 'SPOTV') return false;
        if (tab === 'KR' && !String(c.group).startsWith('한국')) return false;
        if (tab !== 'KR' && tab !== 'ALL' && c.group !== tab) return false;
      }
      return !q || norm(c.name).includes(q) || norm(c.title).includes(q);
    });
    const list = $('#list');
    if (io) io.disconnect();
    const keepScroll = list.scrollTop;
    list.textContent = '';
    if (tab === 'SPOTV') list.appendChild(spotvHeader());
    visible.forEach(c => {
      const b = document.createElement('button');
      b.className = 'ch';
      b.setAttribute('role', 'listitem');
      b.dataset.key = key(c);
      if (key(c) === currentKey) b.setAttribute('aria-current', 'true');

      const lg = document.createElement('div');
      lg.className = 'logo';
      if (c.logo) {
        const img = document.createElement('img');
        img.loading = 'lazy'; img.alt = ''; img.referrerPolicy = 'no-referrer';
        img.onerror = () => img.remove();
        img.src = c.logo;
        lg.appendChild(img);
      }
      const tx = document.createElement('div');
      const nm = document.createElement('span');
      nm.className = 'nm'; nm.textContent = c.title || c.name;
      const np = document.createElement('span');
      np.className = 'np';
      const cur = nowOf(c);
      np.textContent = cur ? cur.t : '';
      tx.append(nm, np);
      b.append(lg, tx);
      b.onclick = () => play(c);
      const th = thumbs[key(c)];
      if (th && th.url) setThumb(lg, th.url);
      if (preview && ensureIO()) io.observe(b);
      list.appendChild(b);
    });
    list.scrollTop = keepScroll;
    $('#status').textContent = `채널 ${visible.length}개 · 목록 갱신 ${fmt(lastLoad)}` + (srcName ? ` · ${srcName}` : '');
  }

  function markCurrent(scroll = true) {
    document.querySelectorAll('.ch').forEach(el => {
      if (el.dataset.key === currentKey) {
        el.setAttribute('aria-current', 'true');
        if (scroll) el.scrollIntoView({ block: 'nearest' });
      } else el.removeAttribute('aria-current');
    });
  }

  // ---------- SPOTV NOW 방송 확인 ----------
  async function fetchText(url, ms = 7000) {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), ms);
    try {
      const r = await fetch(url, { cache: 'no-store', signal: ac.signal });
      return { ok: r.ok, text: r.ok ? await r.text() : '' };
    } finally { clearTimeout(timer); }
  }

  // 'live' 방송 중 / 'off' 방송 없음 / 'unknown' 확인 불가(네트워크·CORS 오류, 방송 종료 시 응답 포함)
  async function probe(ch) {
    const k = key(ch);
    let url = ch.uris[0];
    try {
      let r = await fetchText(url);
      if (!r.ok || !r.text.startsWith('#EXTM3U')) return 'off';
      let text = r.text;
      if (/#EXT-X-STREAM-INF/.test(text)) {
        const line = text.split(/\r?\n/).find(l => l && !l.startsWith('#'));
        if (!line) return 'off';
        url = new URL(line, url).href;
        r = await fetchText(url);
        if (!r.ok) return 'off';
        text = r.text;
      }
      if (!/#EXTINF/.test(text) || /#EXT-X-ENDLIST/.test(text)) return 'off';

      // 마지막 세그먼트 시각이 너무 오래됐으면 종료된 것으로 본다
      const pdt = [...text.matchAll(/#EXT-X-PROGRAM-DATE-TIME:(\S+)/g)].pop();
      if (pdt) {
        const t = Date.parse(pdt[1]);
        if (t && Date.now() - t > 180000) return 'off';
      }
      // 시퀀스 번호가 90초 넘게 그대로면 멈춘 스트림으로 본다
      const m = /#EXT-X-MEDIA-SEQUENCE:(\d+)/.exec(text);
      if (m) {
        const seq = +m[1], prev = seen[k], now = Date.now();
        if (!prev || prev.seq !== seq) seen[k] = { seq, t: now };
        else if (now - prev.t >= 90000) return 'off';
      }
      return 'live';
    } catch (e) { return 'unknown'; }
  }

  function refreshSpotvUI() {
    if (tab === 'SPOTV' || tab === 'ALL') { renderList(); markCurrent(false); }
  }

  async function loadSpotvList() {
    if (!SPOTV_LIST_URL) return;
    try {
      const r = await fetch(SPOTV_LIST_URL + (SPOTV_LIST_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const found = [...(await r.text()).matchAll(/https?:\/\/ch(\d+)-nlivecdn\.spotvnow\.co\.kr\/\S+?\.m3u8\S*/g)];
      if (!found.length) return;
      const list = found.map(m => {
        const name = 'SPOTV NOW ' + m[1].padStart(2, '0');
        return { group: 'SPOTV NOW', name, title: name, logo: '', extra: true, uris: [m[0]] };
      });
      SPOTV.length = 0;
      SPOTV.push(...list);
    } catch (e) {}
  }

  async function probeAll() {
    if (probing) return;
    probing = true; probeDone = 0;
    refreshSpotvUI();
    await loadSpotvList();
    const queue = SPOTV.slice();
    const worker = async () => {
      while (queue.length) {
        const ch = queue.shift();
        live[key(ch)] = await probe(ch);
        probeDone++;
        if (probeDone % 10 === 0) refreshSpotvUI();
      }
    };
    await Promise.all(Array.from({ length: 8 }, worker));
    probing = false; lastProbe = Date.now();
    refreshSpotvUI();
  }

  function maybeProbe() {
    if (!probing && (!lastProbe || Date.now() - lastProbe > 300000)) probeAll();
  }

  function spotvHeader() {
    const vals = Object.values(live);
    const n = vals.filter(v => v === 'live').length;
    const u = vals.filter(v => v === 'unknown').length;
    const h = document.createElement('div');
    h.className = 'sphead';
    const p = document.createElement('div');
    p.textContent = probing
      ? `방송 확인 중… ${probeDone}/${SPOTV.length}`
      : `방송 중 ${n}개 (전체 ${SPOTV.length}개 중)` + (lastProbe ? ` · ${fmt(lastProbe)} 확인` : '');
    h.appendChild(p);
    if (!probing && lastProbe && n === 0) {
      const e = document.createElement('div');
      e.className = 'sub'; e.textContent = '지금 방송 중인 채널이 없습니다.';
      h.appendChild(e);
    }
    const row = document.createElement('div');
    row.className = 'row';
    const re = document.createElement('button');
    re.textContent = '다시 확인'; re.disabled = probing;
    re.onclick = () => probeAll();
    row.appendChild(re);
    if (u > 0) {
      const tg = document.createElement('button');
      tg.textContent = `확인 불가 ${u}개 ${showUnknown ? '숨기기' : '보기'}`;
      tg.onclick = () => { showUnknown = !showUnknown; renderList(); markCurrent(false); };
      row.appendChild(tg);
    }
    h.appendChild(row);
    if (u > 0) {
      const hint = document.createElement('div');
      hint.className = 'sub';
      hint.textContent = '확인 불가는 방송이 끝난 채널이거나, 브라우저가 서버 접근(CORS)을 막은 경우입니다.';
      h.appendChild(hint);
    }
    return h;
  }

  // ---------- 재생 ----------
  function showMsg(text, isError, url) {
    const m = $('#msg');
    m.textContent = '';
    m.className = text ? ('show' + (isError ? ' error' : '')) : '';
    if (!text) return;
    const t = document.createElement('div');
    t.className = 't'; t.textContent = text;
    m.appendChild(t);
    if (isError) {
      const row = document.createElement('div');
      row.className = 'row';
      const re = document.createElement('button');
      re.textContent = '다시 시도';
      re.onclick = () => { const c = byKey(currentKey); if (c) { lastLoad = 0; play(c); } };
      row.appendChild(re);
      if (url) {
        const a = document.createElement('a');
        a.textContent = '스트림 주소 열기';
        a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        row.appendChild(a);
      }
      m.appendChild(row);
    }
  }

  const allChannels = () => channels.concat(SPOTV);
  const byKey = k => allChannels().find(c => key(c) === k);

  function startStream(url) {
    playingUrl = url;
    const v = $('#v');
    if (hls) { hls.destroy(); hls = null; }
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls();
      hls.on(Hls.Events.MANIFEST_PARSED, () => { showMsg(''); v.play().catch(() => {}); });
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) onFail(url, d.details || d.type); });
      hls.attachMedia(v);
      hls.loadSource(url);
    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = url;
      v.onloadeddata = () => showMsg('');
      v.onerror = () => onFail(url, 'native');
      v.play().catch(() => {});
    } else {
      showMsg('이 브라우저는 HLS 재생을 지원하지 않습니다.', true, url);
    }
  }

  async function onFail(url, why) {
    const k = currentKey;
    // 주소(토큰)가 바뀌었을 수 있으니 JSON을 새로 받아 최대 2번 자동 재시도
    if (attempt < 2) {
      attempt++;
      showMsg('주소를 새로 받아 다시 시도하는 중… (' + attempt + '/2)');
      try { await withTimeout(loadChannels(), 5000); } catch (e) {}
      if (k !== currentKey) return;               // 그 사이 다른 채널로 넘어간 경우
      const c = byKey(k);
      const u = c && c.uris && (c.uris[uriIdx] || c.uris[0]);
      if (u) { startStream(u); return; }
    }
    // 대체 주소가 있으면 다음 주소로
    const cur = byKey(currentKey);
    if (cur && cur.uris && uriIdx + 1 < cur.uris.length) {
      uriIdx++; attempt = 0;
      showMsg('다른 주소로 시도하는 중…');
      startStream(cur.uris[uriIdx]);
      return;
    }
    let hint = '재생에 실패했습니다. 스트림 서버의 접근 제한(CORS)이나 주소 만료일 수 있습니다.';
    if (location.protocol === 'https:' && /^http:/i.test(url)) {
      hint = 'https 페이지에서는 http 스트림이 차단됩니다. 이 파일을 로컬에서 열거나 http 주소로 접속하세요.';
    }
    showMsg(hint + ' (' + why + ')', true, url);
  }

  async function play(ch) {
    currentKey = key(ch);
    attempt = 0; uriIdx = 0;
    if (mobile()) openPlayer();
    try { localStorage.setItem('koreatv:last', currentKey); } catch (e) {}
    markCurrent();
    showMsg('불러오는 중…');
    // 주소(토큰)는 자주 바뀌므로 채널을 열 때마다 JSON을 새로 받는다 (3초 안에 받은 건 재사용)
    if (Date.now() - lastLoad > 3000) { try { await withTimeout(loadChannels(), 4000); } catch (e) {} }
    const fresh = byKey(currentKey) || ch;
    $('#cname').textContent = fresh.title || fresh.name;
    $('#navt').textContent = fresh.title || fresh.name;
    renderInfo();
    startStream(fresh.uris[0]);
  }

  // ---------- 편성표 ----------
  function renderInfo() {
    const ch = byKey(currentKey);
    if (!ch) return;
    const arr = programmes(ch);
    const t = Date.now();
    const i = arr.findIndex(p => p.s <= t && t < p.e);
    const cur = arr[i], nxt = i >= 0 ? arr[i + 1] : arr.find(p => p.s > t);
    $('#now').textContent = cur ? cur.t : (arr.length ? '' : '이 채널은 편성표 정보가 없습니다');
    $('#nowtime').textContent = cur ? `${fmt(cur.s)} - ${fmt(cur.e)}` : '';
    $('#bar i').style.width = cur ? Math.min(100, Math.max(0, (t - cur.s) / (cur.e - cur.s) * 100)) + '%' : '0';
    $('#next').textContent = nxt ? `다음 ${fmt(nxt.s)} ${nxt.t}` : '';

    const box = $('#sched');
    box.textContent = '';
    arr.filter(p => p.e > t).slice(0, 12).forEach(p => {
      const row = document.createElement('div');
      row.className = 'pg' + (p.s <= t ? ' on' : '');
      const tm = document.createElement('time'); tm.textContent = fmt(p.s);
      const ti = document.createElement('span'); ti.textContent = p.t;
      row.append(tm, ti);
      box.appendChild(row);
    });
  }

  function refreshNowPlaying() {
    document.querySelectorAll('.ch').forEach(el => {
      const c = byKey(el.dataset.key);
      const cur = c && nowOf(c);
      const np = el.querySelector('.np');
      if (np) np.textContent = cur ? cur.t : '';
    });
    renderInfo();
  }

  // ---------- 채널 미리보기(썸네일) ----------
  function setThumb(lg, url) {
    let im = lg.querySelector('img.thumb');
    if (!im) { im = document.createElement('img'); im.className = 'thumb'; im.alt = ''; lg.appendChild(im); }
    im.src = url;
  }

  function paintThumb(k) {
    const th = thumbs[k];
    if (!th || !th.url) return;
    document.querySelectorAll('.ch').forEach(el => {
      if (el.dataset.key === k) setThumb(el.querySelector('.logo'), th.url);
    });
  }

  function ensureIO() {
    if (io || !('IntersectionObserver' in window)) return io;
    io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const k = e.target.dataset.key, th = thumbs[k];
        const ttl = th && th.url ? 10 * 60000 : 30 * 60000;   // 성공은 10분, 실패는 30분 뒤에 다시 시도
        if (!th || Date.now() - th.t > ttl) enqueue(k);
      });
    }, { root: $('#list'), rootMargin: '120px' });
    return io;
  }

  // 영상을 숨은 video로 잠깐 열어 첫 화면을 캔버스로 캡처한다 (실패하면 null)
  function captureThumb(ch) {
    return new Promise(resolve => {
      const url = ch.uris[0];
      const v = document.createElement('video');
      v.muted = true; v.defaultMuted = true; v.playsInline = true;
      v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
      v.style.cssText = 'position:fixed;left:-9999px;top:0;width:160px;height:90px;opacity:0;pointer-events:none';
      document.body.appendChild(v);
      let h = null, done = false, tries = 0;
      const finish = data => {
        if (done) return;
        done = true; clearTimeout(timer);
        try { if (h) h.destroy(); } catch (e) {}
        try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
        v.remove();
        resolve(data || null);
      };
      const timer = setTimeout(() => finish(null), 15000);
      const grab = () => {
        if (done || !v.videoWidth || v.readyState < 2) return;
        try {
          const w = 240, hh = Math.max(1, Math.round(w * v.videoHeight / v.videoWidth));
          const c = document.createElement('canvas');
          c.width = w; c.height = hh;
          const g = c.getContext('2d');
          g.drawImage(v, 0, 0, w, hh);
          const px = g.getImageData(0, 0, w, hh).data;
          let sum = 0, n = 0;
          for (let i = 0; i < px.length; i += 64) { sum += px[i] + px[i + 1] + px[i + 2]; n += 3; }
          if (sum / n < 8 && ++tries < 5) return;           // 검은 화면이면 다음 프레임에서 다시 시도
          finish(c.toDataURL('image/jpeg', 0.6));
        } catch (e) { finish(null); }                       // 교차 출처 영상이면 캔버스 접근이 막힌다
      };
      v.addEventListener('loadeddata', grab);
      v.addEventListener('timeupdate', grab);
      v.addEventListener('playing', () => setTimeout(grab, 300));
      if (window.Hls && Hls.isSupported()) {
        h = new Hls({ startLevel: 0, maxBufferLength: 3, maxMaxBufferLength: 6, backBufferLength: 0 });
        h.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) finish(null); });
        h.attachMedia(v);
        h.loadSource(url);
      } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
        v.src = url;
      } else { finish(null); return; }
      v.play().catch(() => {});
    });
  }

  function enqueue(k) {
    if (queued.has(k)) return;
    queued.add(k); capQueue.push(k);
    pump();
  }

  function pump() {
    while (capBusy < 2 && capQueue.length) {   // 동시에 2개까지만 받는다
      const k = capQueue.shift();
      const ch = byKey(k);
      if (!ch || !(ch.uris && ch.uris[0]) || (ch.extra && live[k] !== 'live')) { queued.delete(k); continue; }
      capBusy++;
      captureThumb(ch).then(u => {
        thumbs[k] = { url: u || '', t: Date.now() };
        if (u) paintThumb(k);
      }).finally(() => { capBusy--; queued.delete(k); pump(); });
    }
  }

  function setPreview(on) {
    preview = on;
    try { localStorage.setItem('koreatv:preview', on ? '1' : '0'); } catch (e) {}
    document.body.classList.toggle('pv', on);
    $('#pv').setAttribute('aria-pressed', String(on));
    if (!on) { if (io) io.disconnect(); capQueue.length = 0; queued.clear(); }
    renderList(); markCurrent(false);
  }

  $('#pv').onclick = () => {
    if (!preview) {
      let ok = false;
      try { ok = localStorage.getItem('koreatv:pvok') === '1'; } catch (e) {}
      if (!ok) {
        if (!confirm('보이는 채널마다 영상을 잠깐씩 받아 미리보기를 만듭니다. 데이터를 쓰니 와이파이에서 켜는 걸 권장해요. 켤까요?')) return;
        try { localStorage.setItem('koreatv:pvok', '1'); } catch (e) {}
      }
    }
    setPreview(!preview);
  };

  // ---------- 주소 실시간 갱신 ----------
  const urlBase = u => String(u || '').split('?')[0];

  async function bgRefresh() {
    if (document.hidden) return;
    const before = channels.map(key).join('|');
    try { await withTimeout(loadChannels(), 8000); } catch (e) { return; }
    if (channels.map(key).join('|') !== before) { renderTabs(); renderList(); markCurrent(false); }
    // 재생 중인 채널의 주소 자체(경로)가 바뀌었으면 새 주소로 전환한다.
    // 토큰(? 뒤)만 바뀐 경우는 끊김을 피하려고 그대로 두고, 재생이 실패하면 그때 새 주소를 쓴다.
    const c = byKey(currentKey);
    const u = c && !c.extra && c.uris && c.uris[uriIdx];
    if (playingUrl && u && urlBase(u) !== urlBase(playingUrl)) {
      showMsg('주소가 바뀌어 새 주소로 전환합니다…');
      attempt = 0;
      startStream(u);
    }
  }

  $('#reload').onclick = () => {
    const c = byKey(currentKey);
    if (c) { lastLoad = 0; play(c); }
  };

  // ---------- 모바일 화면 전환 ----------
  function setView(v) { $('#app').classList.toggle('playing', v === 'player'); }

  function openPlayer() {
    const app = $('#app');
    if (app.classList.contains('playing')) return;
    savedScroll = $('#list').scrollTop;
    capQueue.length = 0; queued.clear();
    try { history.pushState({ v: 'player' }, ''); } catch (e) {}
    app.classList.add('playing');
    $('main').scrollTop = 0;
    window.scrollTo(0, 0);
  }

  function stopPlayback() {
    playingUrl = '';
    if (hls) { hls.destroy(); hls = null; }
    const v = $('#v');
    try {
      v.onerror = null; v.onloadeddata = null;
      v.pause(); v.removeAttribute('src'); v.load();
    } catch (e) {}
    showMsg('');
  }

  function backToList() {
    stopPlayback();
    setView('select');
    requestAnimationFrame(() => { $('#list').scrollTop = savedScroll; markCurrent(false); });
  }

  function zap(d) {
    if (!visible.length) return;
    const i = visible.findIndex(c => key(c) === currentKey);
    const n = Math.max(0, Math.min(visible.length - 1, (i < 0 ? 0 : i + d)));
    play(visible[n]);
  }

  $('#back').onclick = () => {
    if (history.state && history.state.v === 'player') history.back();
    else backToList();
  };
  $('#navprev').onclick = () => zap(-1);
  $('#navnext').onclick = () => zap(1);
  window.addEventListener('popstate', () => { if (mobile()) backToList(); });

  // ---------- 입력 ----------
  $('#q').addEventListener('input', e => { query = e.target.value; renderList(); markCurrent(); });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    if (!visible.length) return;
    e.preventDefault();
    const i = visible.findIndex(c => key(c) === currentKey);
    const n = e.key === 'ArrowDown' ? Math.min(visible.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
    play(visible[n]);
  });

  // ---------- 시작 ----------
  (async () => {
    try {
      await Promise.all([loadChannels(), loadEpg()]);
    } catch (e) {
      $('#status').textContent = '채널 목록을 불러오지 못했습니다: ' + e.message;
      return;
    }
    document.body.classList.toggle('pv', preview);
    $('#pv').setAttribute('aria-pressed', String(preview));
    renderTabs();
    renderList();
    let last = null;
    try { last = localStorage.getItem('koreatv:last'); } catch (e) {}
    const start = (last && byKey(last)) || visible[0];
    if (start) {
      if (mobile()) { currentKey = key(start); markCurrent(false); } // 모바일은 채널 선택 화면으로 시작
      else play(start);
    }
    setInterval(refreshNowPlaying, 30000);
    setInterval(bgRefresh, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) bgRefresh(); });
    window.addEventListener('online', bgRefresh);
    setInterval(() => { if (tab === 'SPOTV' && !document.hidden) maybeProbe(); }, 60000);
    setInterval(async () => { await loadEpg(); refreshNowPlaying(); }, 30 * 60000);
  })();
})();
</script>
</body>
</html>
